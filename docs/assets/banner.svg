<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#6366f1;#38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#a855f7;#60a5fa" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#38bdf8;#818cf8" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Line Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 54px;
      letter-spacing: -1px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .tag {
      font-family: 'SF Mono', Monaco, Consolas, 'Courier New', monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .highway-line {
      stroke: #1e293b;
      stroke-width: 2;
      stroke-dasharray: 8 6;
    }
    .pulse-flow-1 {
      stroke: #38bdf8;
      stroke-width: 3;
      stroke-dasharray: 160 400;
      animation: flow 4s linear infinite;
    }
    .pulse-flow-2 {
      stroke: #6366f1;
      stroke-width: 3;
      stroke-dasharray: 120 380;
      animation: flowReverse 5s linear infinite;
    }
    .pulse-flow-3 {
      stroke: #10b981;
      stroke-width: 3;
      stroke-dasharray: 90 320;
      animation: flow 3.5s linear infinite;
    }
    .radar-sweep {
      transform-origin: 1040px 190px;
      animation: rotateSweep 8s linear infinite;
    }
    @keyframes flow {
      0% { stroke-dashoffset: 560; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flowReverse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 500; }
    }
    @keyframes rotateSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes beacon {
      0%, 100% { opacity: 0.3; r: 6px; }
      50% { opacity: 0.9; r: 10px; }
    }
    .beacon-light {
      animation: beacon 2s ease-in-out infinite;
    }
  </style>

  <!-- Card Background with subtle border -->
  <rect x="2" y="2" width="1196" height="376" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Background Digital Grid Pattern -->
  <g opacity="0.12">
    <line x1="0" y1="76" x2="1200" y2="76" stroke="#475569" stroke-width="1" />
    <line x1="0" y1="152" x2="1200" y2="152" stroke="#475569" stroke-width="1" />
    <line x1="0" y1="228" x2="1200" y2="228" stroke="#475569" stroke-width="1" />
    <line x1="0" y1="304" x2="1200" y2="304" stroke="#475569" stroke-width="1" />
    
    <line x1="160" y1="0" x2="160" y2="380" stroke="#475569" stroke-width="1" />
    <line x1="320" y1="0" x2="320" y2="380" stroke="#475569" stroke-width="1" />
    <line x1="480" y1="0" x2="480" y2="380" stroke="#475569" stroke-width="1" />
    <line x1="640" y1="0" x2="640" y2="380" stroke="#475569" stroke-width="1" />
    <line x1="800" y1="0" x2="800" y2="380" stroke="#475569" stroke-width="1" />
    <line x1="960" y1="0" x2="960" y2="380" stroke="#475569" stroke-width="1" />
  </g>

  <!-- Flow Corridors (Curved Highway Vectors) -->
  <path d="M 60,330 C 300,330 450,290 620,290 C 780,290 900,230 1140,230" fill="none" class="highway-line" />
  <path d="M 60,330 C 300,330 450,290 620,290 C 780,290 900,230 1140,230" fill="none" class="pulse-flow-1" filter="url(#glow)" />

  <path d="M 60,350 C 260,350 420,315 600,315 C 800,315 950,250 1140,250" fill="none" class="highway-line" />
  <path d="M 60,350 C 260,350 420,315 600,315 C 800,315 950,250 1140,250" fill="none" class="pulse-flow-2" filter="url(#glow)" />

  <path d="M 60,310 C 320,310 470,265 650,265 C 820,265 920,210 1140,210" fill="none" class="highway-line" />
  <path d="M 60,310 C 320,310 470,265 650,265 C 820,265 920,210 1140,210" fill="none" class="pulse-flow-3" filter="url(#glow)" />

  <!-- Radar / Station ATR 301 Target Visualizer -->
  <g transform="translate(1040, 190)">
    <circle r="90" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle r="65" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" />
    <circle r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
    <circle r="15" fill="none" stroke="#60a5fa" stroke-width="2" />
    <circle r="5" fill="#38bdf8" class="beacon-light" filter="url(#glow)" />
    
    <!-- Crosshairs -->
    <line x1="-95" y1="0" x2="95" y2="0" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="-95" x2="0" y2="95" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Sweeping Scanner Beam -->
    <g class="radar-sweep">
      <path d="M 0,0 L 88,-15 A 90 90 0 0 0 88,15 Z" fill="url(#accentGrad)" opacity="0.35" />
    </g>
    
    <!-- Station Annotation -->
    <text x="0" y="115" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" fill="#64748b" font-weight="600">STATION ATR 301 (I-94)</text>
  </g>

  <!-- Header Category & Status -->
  <g transform="translate(70, 68)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#10b981" />
    <circle cx="5" cy="5" r="4" fill="#10b981" class="beacon-light" filter="url(#glow)" />
    <text x="22" y="9" class="tag">INTELLIGENT TRANSPORTATION SYSTEM // MACHINE LEARNING PLATFORM</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(70, 140)">
    <text class="title">TrafficFlow <tspan fill="url(#accentGrad)">AI</tspan></text>
    <text x="0" y="44" class="subtitle">Vehicle Flow Prediction &amp; Real-Time Uncertainty Analytics</text>
  </g>

  <!-- Feature Metric Pills -->
  <g transform="translate(70, 225)">
    <!-- Pill 1: Model Accuracy -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="185" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="42" rx="2" fill="#10b981" />
      <text x="16" y="18" font-family="sans-serif" font-size="10" fill="#64748b" font-weight="700">MODEL ACCURACY</text>
      <text x="16" y="34" class="badge-text">R² = 0.9818 (RF)</text>
    </g>

    <!-- Pill 2: Residual Error -->
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="200" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="42" rx="2" fill="#38bdf8" />
      <text x="16" y="18" font-family="sans-serif" font-size="10" fill="#64748b" font-weight="700">UNCERTAINTY BAND</text>
      <text x="16" y="34" class="badge-text">95% CI (±1.96 × se)</text>
    </g>

    <!-- Pill 3: Observations -->
    <g transform="translate(415, 0)">
      <rect x="0" y="0" width="185" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="42" rx="2" fill="#818cf8" />
      <text x="16" y="18" font-family="sans-serif" font-size="10" fill="#64748b" font-weight="700">DATASET SCOPE</text>
      <text x="16" y="34" class="badge-text">48,204 Observations</text>
    </g>

    <!-- Pill 4: Anomaly Threshold -->
    <g transform="translate(615, 0)">
      <rect x="0" y="0" width="195" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="42" rx="2" fill="#f59e0b" />
      <text x="16" y="18" font-family="sans-serif" font-size="10" fill="#64748b" font-weight="700">ANOMALY DETECTION</text>
      <text x="16" y="34" class="badge-text">&gt; 2.4σ Flow Deviation</text>
    </g>
  </g>

</svg>
